<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CoCreate PWA Install | CoCreateJS</title>
    <meta name="description" content="Capture the browser install prompt and present an application-owned install button.">
    <link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
    <main>
        <h1>CoCreate PWA Install</h1>
        <p>CoCreate PWA handles the browser install prompt. Service workers, storage, notifications, and other browser capabilities are separate components.</p>
        <button actions="install" type="button" hidden>Install this app</button>
    </main>
    <script src="../dist/CoCreate-pwa.js"></script>
</body>
</html>
